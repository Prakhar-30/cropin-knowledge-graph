# One template per concept that carries a generated summary.
#
# Summaries are always generated, never authored, so they cannot drift from the data. A template that
# references a relation absent from relations.yaml is a build failure.
#
# Slots:
#   {metric}                       a metric on the record itself, formatted with thousands separators
#   {top:relation}                 label of the heaviest link on that relation
#   {top_weight:relation}          weight of that heaviest link
#   {list:relation}                labels of every link on that relation, comma separated, "and" last
#   {count:relation}               number of links on that relation
#   {attr:Attribute name}          a display attribute of the record
#   {if:relation}...{else}...{endif}   branch on whether any link exists on that relation
#   any relation may take a |reverse modifier to be read backwards
#
# Write templates so a count is never followed by a noun phrase it has to agree with - prefer
# "Growth stages configured: 7" over "7 growth stages configured". Where a count does sit directly in
# front of its noun, the renderer makes it agree in number.
version: 1
templates:

  - concept: crop
    template: >
      {count:variety of|reverse} varieties across {plots} plots, mostly {top:variety of|reverse} at
      {top_weight:variety of|reverse} plots.
      Growth stages configured: {count:has growth stage}.
      {if:graded by}Grades available: {list:graded by}.{else}No harvest grade configured.{endif}
      {if:prone to}Prone to {list:prone to}.{else}No disease or pest configured against it.{endif}
      {if:alert observed}Worst agricultural alert observed is {top:alert observed}, on
      {top_weight:alert observed} plots.{endif}

  - concept: variety
    template: >
      {plots} plots{ifm:growers}, {growers} growers{endif}{ifm:projects}, {projects} projects{endif}.
      {ifm:gap_pct}Achieved {achieved} against {expected} expected, {gap_pct} percent.{endif}
      Mostly {top:grown in region} ({top_weight:grown in region} plots), grown in {list:grown in season}.
      Mainly {top:grown on soil} soil{if:irrigated by} under {top:irrigated by}{endif}.
      {if:sub variety of|reverse}Tracked as {list:sub variety of|reverse}.{endif}
      {if:plan for variety|reverse}Run on {top:plan for variety|reverse}.{else}No crop plan attached to
      it.{endif}
      {if:susceptible}Recorded susceptible to {list:susceptible}.{else}No disease recorded against
      it.{endif}
      {if:susceptible|many}Most often {top:susceptible}, on {top_weight:susceptible} plots.{endif}

  - concept: sub_variety
    template: >
      {plots} plots and {growers} growers under {top:sub variety of}.
      Purpose {attr:Purpose}, grade expectation {attr:Grade expectation}.
      {if:graded by}Graded by {list:graded by}.{else}No grade configured against it.{endif}
