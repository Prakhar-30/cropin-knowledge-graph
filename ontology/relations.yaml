      - { from: season_weather_outcome, to: crop }

  - key: warnings for
    order: 65
    forward: Disease or pest
    reverse: DEWS warning history
    weighted: false
    cardinality: many_to_one
    pairs:
      - { from: dews_history, to: disease_or_pest }
