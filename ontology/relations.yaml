    weighted: false
    cardinality: many_to_one
    pairs:
      - { from: season_weather_outcome, to: variety }

  - key: season record for
    order: 64
    forward: Crop
    reverse: Season weather and the harvest it produced
    weighted: false
    cardinality: many_to_one
